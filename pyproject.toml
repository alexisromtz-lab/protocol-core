# protocol-core — Materia A: Protocolo de Custodia Determinista y Reserva de
# Ranuras. Metadatos de empaquetado (§6.3: la versión del árbol se declara; la
# del documento, en la cabecera de `SPEC.md`).
#
# Agnosticismo estricto (§0.4) aplicado al empaquetado:
#   · CERO dependencias de ejecución      -> `dependencies = []`
#   · CERO dependencias locales           -> nada de `../`, nada del prototipo
#   · CERO rutas absolutas                -> el paquete se busca SÓLO bajo `src/`
#   · CERO directorios ajenos             -> `where = ["src"]` y `include = ["protocol*"]`
#     (ni `tests/`, ni la raíz plana de actas, ni bitácora alguna: §6.1 dice que
#      el subárbol no contiene bitácora, y el empaquetado no la introduce)
#
# Motor de pruebas — UNO SOLO, y es el de la biblioteca estándar: `unittest`.
# Los 3 archivos de `tests/` hacen `import unittest`; 0 de los 8 `.py`
# rastreados hacen `import pytest`. Corrida declarada, desde la raíz que
# contiene `protocol-core/`:
#
#     python3 -B -m unittest discover -s protocol-core/tests -v
#
# Lo que el aparato invoca es ese mismo motor bajo otro descubridor: el
# aparato (`.github/ci-apparatus`) corre
#
#     python -m pytest -q --junitxml=/tmp/junit.xml
#
# sobre esta misma suite, donde `pytest` es el COLECTOR y el productor del
# junitxml, no un segundo motor de aserciones. Un motor, un colector: no hay
# dos salidas que puedan diferir. `pytest` lo instala el runner
# (`.github/workflows/ci.yml`: `python -m pip install pytest`), no este
# manifiesto — de ahí la extra `dev` de abajo, que declara la instalación sin
# convertirla en dependencia de ejecución.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-core"
version = "0.1.0"
description = "Ficha, partición y manifiesto medidos fuera de banda, y los invariantes de custodia (Materia A)"
# Piso declarado, NO medido: el árbol se corre con el intérprete del sistema
# (3.14.7). El piso es una declaración de empaquetado, no una cifra del objeto.
requires-python = ">=3.11"
dependencies = []

# Extra de DESARROLLO, no de ejecución: NO se distribuye con el paquete y no
# contradice `dependencies = []` (§0.4). Declara lo que el aparato ya instala
# a ciegas, para que la instalación tenga un portador en el manifiesto y no
# quede sólo en el template del runner. Se activa con `pip install -e .[dev]`.
[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["protocol*"]

