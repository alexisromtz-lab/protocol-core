# HUELLA-PC-UNA-LINEA-20261127
# La compuerta vive en frontera-runner y se referencia por pin; aqui no se copia.
# Sin `--excluir` y sin `--permitidos`: el minuendo es el arbol de la base, que resta solo los
# 5 ceros que ya existian. Una compuerta estricta por defecto es la unica que no puede
# fabricar un verde.
name: ceros

# Un solo disparador: la base de un PR tiene sha; un dispatch no, y una compuerta que no
# sabe contra que resta no publica un veredicto.
on:
  pull_request:

jobs:
  ceros:
    uses: alexisromtz-lab/frontera-runner/.github/workflows/reusable-ceros.yml@v0.2.0
